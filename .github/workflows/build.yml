
name: Build GTA Extreme Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract launcher
        run: |
          mkdir extracted
          unzip -q GTAExtremeLauncher_V0.1_CloudBuild.zip -d extracted

      - name: Build Android APK
        run: |
          cd extracted/GTAExtremeLauncher
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA-Extreme-Launcher-V0.1
          path: extracted/GTAExtremeLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
